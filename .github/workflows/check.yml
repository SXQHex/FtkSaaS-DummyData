name: Check standalone seed tooling
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: seed_smoke
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run check
      - name: Verify Supabase TLS without credentials
        run: node tls-probe.mjs
      - name: Exercise Snaplet against disposable PostgreSQL
        run: node smoke.mjs
        env:
          SNAPLET_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/seed_smoke
          SNAPLET_LOCAL_TEST: '1'
