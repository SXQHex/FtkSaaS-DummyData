name: Snaplet SQL preview
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Veri profili
        type: choice
        options: [pilot3, expand7]
        default: pilot3
        required: true
permissions:
  contents: read
concurrency:
  group: snaplet-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require connection secret
        env:
          HAS_CONNECTION: ${{ secrets.SNAPLET_DATABASE_URL != '' }}
        run: |
          test "$HAS_CONNECTION" = true || { echo 'Add the SNAPLET_DATABASE_URL Actions secret.'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run check
      - name: Generate read-only preview
        run: npm run preview
        env:
          SNAPLET_DATABASE_URL: ${{ secrets.SNAPLET_DATABASE_URL }}
          SNAPLET_PROFILE: ${{ inputs.profile }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snaplet-preview-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 3
      - name: Summarize
        run: echo 'Preview only. Counts and profile are in the manifest. No database writes. Download the SQL artifact for review.' >> "$GITHUB_STEP_SUMMARY"
